name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegissoc
          POSTGRES_PASSWORD: aegissoc
          POSTGRES_DB: aegissoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegissoc -d aegissoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aegissoc:aegissoc@localhost:5432/aegissoc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify PostgreSQL migration revision
        run: alembic current
      - name: Provision least-privilege runtime database role
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://aegissoc:aegissoc@localhost:5432/aegissoc
          RUNTIME_DB_PASSWORD: aegis_runtime_ci_password_2026
        run: python -m scripts.configure_runtime_role
      - name: Verify PostgreSQL row-level security as runtime role
        env:
          AEGISSOC_RLS_TEST_URL: postgresql+psycopg://aegis_runtime:aegis_runtime_ci_password_2026@localhost:5432/aegissoc
        run: python -m pytest tests/test_postgres_rls.py -q
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check web/app.js
      - name: Run API tests
        run: python -m pytest -q
