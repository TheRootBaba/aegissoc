title: Rundll32 Remote Script Execution
id: AEGIS-WIN-RUNDLL-001
status: experimental
description: Detects rundll32 command lines referencing remote script handlers.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    event_type: process.started
    Image|endswith: rundll32.exe
    CommandLine|contains:
      - javascript:
      - http:
  condition: selection
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.011
