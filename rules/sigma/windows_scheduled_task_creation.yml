title: Windows Scheduled Task Creation
id: AEGIS-WIN-TASK-001
status: stable
description: Detects scheduled task creation through common Windows process telemetry.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    event_type: process.started
    Image|endswith: schtasks.exe
    CommandLine|contains: /create
  condition: selection
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
