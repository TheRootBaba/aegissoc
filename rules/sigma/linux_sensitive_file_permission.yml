title: Linux Sensitive File Permission Change
id: AEGIS-LNX-CHMOD-001
status: experimental
description: Detects chmod commands targeting sensitive authentication files.
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    event_type: process.started
    Image|endswith: chmod
    CommandLine|contains:
      - /etc/shadow
      - /etc/sudoers
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1222.002
