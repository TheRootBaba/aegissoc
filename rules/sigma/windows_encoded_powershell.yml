title: Encoded PowerShell execution
id: AEGIS-WIN-PS-001
status: experimental
description: Detects process events containing an encoded PowerShell command line.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    event_type: process.started
    CommandLine|contains: -EncodedCommand
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
