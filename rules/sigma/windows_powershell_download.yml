title: PowerShell Remote Content Download
id: AEGIS-WIN-PSDL-001
status: stable
description: Detects PowerShell command lines using common web download primitives.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    event_type: process.started
    Image|endswith: powershell.exe
    CommandLine|contains:
      - DownloadString
      - Invoke-WebRequest
  condition: selection
level: high
tags:
  - attack.execution
  - attack.t1059.001
