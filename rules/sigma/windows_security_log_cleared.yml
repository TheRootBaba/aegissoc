title: Windows Security Log Cleared
id: AEGIS-WIN-LOG-001
status: stable
description: Detects use of the Windows utility to clear event logs.
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    event_type: process.started
    Image|endswith: wevtutil.exe
    CommandLine|contains: cl
  condition: selection
level: high
tags:
  - attack.defense_evasion
  - attack.t1070.001
